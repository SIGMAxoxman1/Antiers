name: Download icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download icons
        run: |
          mkdir -p icons
          for n in overall sword axe pot nethop uhc mace smp; do
            curl -fsSL -A "Mozilla/5.0" "https://tiercore.vercel.app/images/$n.svg" -o "icons/$n.svg"
            echo "ok $n.svg"
          done
          curl -fsSL -A "Mozilla/5.0" "https://subtiers.net/assets/minecart-20260909-v2.png" -o "icons/tntcart.png"
          echo "ok tntcart.png"
          ls -la icons

      - name: Commit icons
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add icons
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Add icons"
            git push
          fi
