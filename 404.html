<style>
:root{--bg:#0b0d18;--fg:#eef1ff;--muted:#8d95b8;--accent:#3ee6c4;--accent-ink:#04120e;--line:#232845;--ui:Rubik,system-ui,Segoe UI,sans-serif;--px:'Pixelify Sans',Rubik,monospace}
:root[data-theme="light"]{--bg:#f4f6ff;--fg:#141a33;--muted:#5b6485;--accent:#0fb89a;--accent-ink:#fff;--line:#d5daf0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:radial-gradient(900px 500px at 50% 0,rgba(62,230,196,.12),transparent 60%),var(--bg);color:var(--fg);font-family:var(--ui);display:grid;place-items:center;padding:24px;overflow-x:hidden}
.box{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:520px}
.trader{width:min(230px,60vw);height:auto;overflow:visible;shape-rendering:crispEdges}
.n404{margin:6px 0 0;font:700 clamp(72px,18vw,120px)/1 var(--px);letter-spacing:.04em;background:linear-gradient(135deg,var(--accent),#7b9cff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:6px 0 8px;font:800 clamp(22px,5vw,30px)/1.15 var(--ui)}
p{margin:0 0 24px;color:var(--muted);font-size:16px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font:700 16px var(--ui);padding:14px 26px;border-radius:10px;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.lang{margin-top:18px;background:none;border:1px solid var(--line);color:var(--muted);font:600 13px var(--ui);padding:8px 14px;border-radius:8px;cursor:pointer}
.lang:hover{color:var(--fg);border-color:var(--accent)}
/* trader animation: 12s loop – glance around, stare at you, scratch head, repeat */
.shadow{animation:sh 12s ease-in-out infinite;transform-origin:88px 272px}
.body{animation:bob 6s steps(2,end) infinite}
.head{animation:headm 12s steps(1,end) infinite}
.pup{animation:look 12s steps(1,end) infinite}
.arm{transform-origin:148px 132px;animation:scratch 12s ease-in-out infinite}
.lid{transform-origin:0 80px;animation:blink 6s steps(1,end) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes sh{50%{transform:scaleX(.96)}}
@keyframes look{0%{transform:translateX(0)}12%{transform:translateX(-8px)}26%{transform:translateX(8px)}40%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes headm{0%{transform:translate(0,0)}12%{transform:translate(-4px,0)}26%{transform:translate(4px,0)}40%{transform:translate(0,0)}55%{transform:translate(0,4px)}78%{transform:translate(4px,4px)}86%{transform:translate(0,0)}100%{transform:translate(0,0)}}
@keyframes scratch{0%,48%{transform:rotate(0)}58%{transform:rotate(162deg)}62%{transform:rotate(170deg)}66%{transform:rotate(154deg)}70%{transform:rotate(170deg)}74%{transform:rotate(154deg)}78%{transform:rotate(168deg)}86%{transform:rotate(162deg)}94%,100%{transform:rotate(0)}}
@keyframes blink{0%,70%,80%,100%{transform:scaleY(0)}75%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
