<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ANtiers</title>
<meta name="description" content="ANtiers – Minecraft PvP tier list. Player rankings across 13 game modes.">
<meta name="theme-color" content="#0b0d18">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("antiers_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<meta property="og:title" content="ANtiers"><meta property="og:description" content="Minecraft PvP tier list. Player rankings across 13 game modes."><meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: sticky mode tabs under a hero that pairs the title with a top-3 podium; below it a ranked list (Overall) or five tier columns (single mode). */
:root{
  --bg:#06070d; --bg2:#0b0d18; --surface:#10131f; --surface2:#171b2b; --line:#242946;
  --fg:#eceffb; --muted:#8c93b6; --accent:#3ee6c4; --accent-ink:#04130f;
  --t1:#ffc233; --t2:#ff8a3d; --t3:#b57bff; --t4:#58a6ff; --t5:#5fe08a;
  --silver:#c9d1ea; --bronze:#d58d57;
  --glow:rgba(62,230,196,.14); --glow2:rgba(181,123,255,.12);
  --px:'Pixelify Sans','Courier New',monospace;
  --ui:'Rubik','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f4fb; --bg2:#e8ebf6; --surface:#ffffff; --surface2:#eff1fa; --line:#d5dbee;
  --fg:#12152a; --muted:#576082; --accent:#0a9a82; --accent-ink:#ffffff;
  --t1:#a96d00; --t2:#bd4f08; --t3:#7436cf; --t4:#1b67cc; --t5:#17823f;
  --silver:#6a7490; --bronze:#a8612a;
  --glow:rgba(10,154,130,.12); --glow2:rgba(116,54,207,.09); color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(900px 420px at 15% -80px,var(--glow),transparent 70%),radial-gradient(800px 380px at 95% 40px,var(--glow2),transparent 70%);
  background-repeat:no-repeat}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t1{--c:var(--t1)}.t2{--c:var(--t2)}.t3{--c:var(--t3)}.t4{--c:var(--t4)}.t5{--c:var(--t5)}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand .logo{width:40px;height:40px;flex:none;filter:drop-shadow(0 0 10px var(--glow))}
.wm{display:inline-block;font:900 25px/1 var(--ui);transform:skewX(-7deg)}
.wm b{background:linear-gradient(100deg,var(--accent),#7b9cff 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gem{width:26px;height:26px;image-rendering:pixelated}
.top nav{display:flex;gap:4px;margin-inline-start:auto;align-items:center;flex-wrap:wrap}
.top nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:4px;font-weight:500;font-size:14px}
.top nav a:hover{color:var(--fg);background:var(--surface)}
.lang.ico{display:inline-grid;place-items:center;width:34px;height:32px;padding:0}.lang.ico svg{width:16px;height:16px}
.lang{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:4px;font-size:13px;font-weight:500}
.lang:hover{border-color:var(--accent)}

/* hero */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--surface),var(--bg2));
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;padding:36px}
.hero canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(canvas){position:relative}
.eyebrow{font:500 12px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font:900 clamp(52px,10vw,104px)/.9 var(--ui);margin:0 0 16px;letter-spacing:-.02em;transform:skewX(-7deg);transform-origin:left bottom}
h1 span{background:linear-gradient(100deg,var(--accent),#7b9cff 65%,var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px var(--glow))}
.hero p.lead{max-width:46ch;color:var(--muted);margin:0 0 22px}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 14px;max-width:420px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;padding:12px 0;outline:none}
.search svg{width:16px;height:16px;flex:none;color:var(--muted)}
.stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font:700 26px/1 var(--px);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;transition:transform .2s,border-color .2s}
.pod:hover{transform:translateY(-3px);border-color:var(--rc)}
.pod .av{width:108px;height:108px}
.pod.p1{--rc:var(--t1);padding-block:26px 20px;border-color:color-mix(in srgb,var(--t1) 60%,var(--line));box-shadow:0 0 40px color-mix(in srgb,var(--t1) 18%,transparent);position:relative}
.pod.p1::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 56px color-mix(in srgb,var(--t1) 32%,transparent);opacity:0;animation:pulse 3.6s ease-in-out infinite}
.pod.p1 .av{width:144px;height:144px}
.pod.p2{--rc:var(--silver);border-color:color-mix(in srgb,var(--silver) 50%,var(--line));box-shadow:0 0 26px color-mix(in srgb,var(--silver) 14%,transparent)}
.pod.p3{--rc:var(--bronze);border-color:color-mix(in srgb,var(--bronze) 50%,var(--line));box-shadow:0 0 26px color-mix(in srgb,var(--bronze) 14%,transparent)}
.pod.p1 .nm{color:var(--t1)}.pod.p2 .nm{color:var(--silver)}.pod.p3 .nm{color:var(--bronze)}
.pod .place{font:700 13px var(--px);color:var(--rc);letter-spacing:.1em}
.pod .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pp{font:700 20px/1 var(--px);font-variant-numeric:tabular-nums}
.pod .pp small{font:500 11px var(--ui);color:var(--muted);letter-spacing:.08em;margin-inline-start:4px}
@keyframes pulse{50%{opacity:1}}

/* avatars, chips */
.av{display:block;object-fit:contain;border-radius:3px;background:none;transform-origin:50% 85%;
  transition:transform .28s cubic-bezier(.2,.9,.25,1.25)}
.av.px{image-rendering:pixelated;background:var(--surface2)}
/* shadow of the character on the wall behind it: a blocky "square person" (head square + shoulders block), shifted to the LEFT and slightly down. Two flat gradient rects, no filters, so it stays cheap. */
.avw{position:relative;display:block;flex:none;line-height:0;--sh:rgba(0,0,0,.4)}
[data-theme="light"] .avw{--sh:rgba(25,30,70,.3)}
.avw>.av{position:relative;z-index:1}
.av.cus{-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.avw::before,.avw::after{content:"";position:absolute;z-index:0;pointer-events:none;transform:translate(-24%,22%) skewX(16deg);transform-origin:50% 100%}
.avw::before{inset:0;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent);
  background:linear-gradient(var(--sh),var(--sh)) 50% 3%/46% 43% no-repeat,linear-gradient(var(--sh),var(--sh)) 50% 100%/86% 56% no-repeat}
/* slanted extension trailing down-left from the shoulder line */
.avw::after{inset:0 0 -5% -45%;background:linear-gradient(to bottom left,var(--sh),transparent 85%);
  clip-path:polygon(35.9% 47.6%,51.7% 47.6%,22.8% 100%,6.9% 100%)}
/* rows below the top 3 get a slightly grey card so the shadow reads */
.row:not(.r1):not(.r2):not(.r3){background:color-mix(in srgb,#9aa0b5 6%,var(--surface))}
[data-theme="light"] .row:not(.r1):not(.r2):not(.r3){background:color-mix(in srgb,#7a8099 5%,var(--surface))}
.row{content-visibility:auto;contain-intrinsic-size:auto 78px}
.dirty{color:#ffb14a!important;font-weight:700}
.row:hover .av,.col li button:hover .av,.pod:hover .av,.phead .av:hover{transform:scale(1.22) translateY(-3px) rotate(-2deg);will-change:transform}
.pod:hover{transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;color:var(--c);font:700 14px/1.4 var(--px);letter-spacing:.03em}
.chip.ht,.tb.ht span{text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.chip.un{--c:var(--muted);font-weight:600;letter-spacing:.08em}
.tb{display:inline-flex;flex-direction:column;align-items:center;gap:6px;min-width:52px;color:var(--c);font:700 15px/1 var(--px);letter-spacing:.04em}
.tb .mi{width:40px;height:40px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transition:transform .22s cubic-bezier(.2,.9,.25,1.25)}
.tb:hover .mi{transform:translateY(-3px) scale(1.14)}
.tb.mid{opacity:.95}
.reg{font:600 10px var(--ui);letter-spacing:.1em;padding:1px 6px;border-radius:3px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.rNA{--c:var(--t4)}.rEU{--c:var(--t5)}.rAS{--c:var(--t3)}.rME{--c:var(--t2)}

/* mode pixel icons */
.mi{display:block;flex:none}

/* tooltip: small box floating above [data-tip] on hover / tap */
[data-tip]{position:relative}
[data-tip]::before,[data-tip]::after{position:absolute;left:50%;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:40}
[data-tip]::after{content:attr(data-tip);bottom:calc(100% + 7px);transform:translateX(-50%) translateY(4px);
  background:var(--surface2);border:1px solid var(--line);color:var(--fg);
  font:600 11px/1.35 var(--ui);padding:4px 8px;border-radius:4px;white-space:nowrap;
  box-shadow:0 8px 20px rgba(0,0,0,.35)}
[data-tip]::before{content:"";bottom:calc(100% + 3px);width:8px;height:8px;background:var(--surface2);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  transform:translateX(-50%) translateY(4px) rotate(45deg)}
[data-tip]:hover::after,[data-tip]:focus-visible::after,[data-tip].tipshow::after{opacity:1;transform:translateX(-50%) translateY(0)}
[data-tip]:hover::before,[data-tip]:focus-visible::before,[data-tip].tipshow::before{opacity:1;transform:translateX(-50%) translateY(0) rotate(45deg)}

/* mode tabs */
.modes{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:22px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.modes .scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mode{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:4px;font-weight:500;font-size:14px;color:var(--muted)}
.mode:hover{color:var(--fg);border-color:var(--muted)}
.mode[aria-selected="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

.demo{margin:14px 0 0;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.demo::before{content:"";width:8px;height:8px;background:var(--t1);flex:none}
.kit{display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.kit[hidden]{display:none}
.kit b{color:var(--fg);font-weight:600}
.kit .mi{color:var(--accent)}

/* overall list */
.list{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.listhead{display:grid;grid-template-columns:112px 250px minmax(0,1fr) 90px;gap:14px;padding:0 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:112px 250px minmax(0,1fr) 90px;gap:14px;align-items:center;text-align:start;
  border:1px solid var(--line);background:var(--surface);padding:12px 18px;border-radius:5px;width:100%;transition:border-color .15s,transform .15s;animation:in .35s ease backwards}
.row:hover{border-color:var(--accent);transform:translateX(3px)}
[dir="rtl"] .row:hover{transform:translateX(-3px)}
.rk{position:relative;display:grid;place-items:center;font:800 30px/1 var(--ui);color:var(--muted);font-variant-numeric:lining-nums tabular-nums}

.row.r1{border-color:color-mix(in srgb,var(--t1) 65%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--t1) 20%,var(--surface)),var(--surface) 62%);box-shadow:0 0 34px color-mix(in srgb,var(--t1) 16%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--t1) 25%,transparent)}
.row.r2{border-color:color-mix(in srgb,var(--silver) 55%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--silver) 13%,var(--surface)),var(--surface) 55%);box-shadow:0 0 22px color-mix(in srgb,var(--silver) 10%,transparent)}
.row.r3{border-color:color-mix(in srgb,var(--bronze) 55%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--bronze) 14%,var(--surface)),var(--surface) 55%);box-shadow:0 0 22px color-mix(in srgb,var(--bronze) 10%,transparent)}
.row.r1 .nm,.row.r1 .pts{color:var(--t1)}.row.r2 .nm,.row.r2 .pts{color:var(--silver)}.row.r3 .nm,.row.r3 .pts{color:var(--bronze)}
.row.r1 .nm{text-shadow:0 0 18px color-mix(in srgb,var(--t1) 45%,transparent)}
.crest{display:block;width:104px;height:82px;overflow:visible}
.c-g{filter:drop-shadow(0 4px 6px rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,194,51,.65))}
.c-s{filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)) drop-shadow(0 0 10px rgba(201,209,234,.45))}
.c-b{filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)) drop-shadow(0 0 10px rgba(213,141,87,.45))}
.crest .gl{animation:glint 3s ease-in-out infinite}
.c-s .gl,.c-b .gl{animation-duration:4.6s}
.crest .sp{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.crest .sp2{animation-delay:1.1s}
@keyframes glint{0%,100%{opacity:.16}50%{opacity:.55}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.pod .rk{margin-bottom:0}
.rkpill{font:800 18px/1 var(--ui);color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:8px 14px}

.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .av{width:78px;height:78px;flex:none}
.who .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .meta{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.chips{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:12px 4px;justify-items:center;align-items:start}
.chips .tb{min-width:0;gap:5px;font-size:15px}
.chips .tb .mi{width:34px;height:34px}
.tb.un{--c:var(--muted);opacity:.3;font-weight:600}
.tb.un .mi{filter:grayscale(1)}
.chips.hd .hi{display:grid;place-items:center;opacity:.75}
.chips.hd .hi:hover{opacity:1}
.chips.hd .hi .mi{width:22px;height:22px}
.pts{text-align:end;font:700 20px/1 var(--px);font-variant-numeric:tabular-nums}
.pts small{display:block;font:500 10px var(--ui);color:var(--muted);letter-spacing:.12em;margin-top:4px;text-transform:uppercase}
@keyframes in{from{transform:translateY(8px)}}

/* mode columns */
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px;align-items:start}
.col{border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden;min-width:0}
.col h3{margin:0;padding:12px 14px;font:700 16px/1 var(--px);letter-spacing:.08em;color:var(--c);display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface));border-bottom:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.col h3 small{font:500 11px var(--ui);color:var(--muted);letter-spacing:.06em}
.col h3 .htitle{display:inline-flex;align-items:center;gap:8px}
.col h3 .mi{opacity:.95}
.col ul{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:3px}
.col li button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:4px;text-align:start;min-width:0}
.col li button:hover{background:var(--surface2)}
.col li .av{width:54px;height:54px;flex:none}
.col li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14px}
.col li .lh{font:700 14px var(--px);color:var(--c);padding:2px 4px;letter-spacing:.03em}
.col li .lh.h{text-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.col .none{padding:18px 14px;color:var(--muted);font-size:13px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* how it works */
section.how{margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
section.how h2{font:700 28px/1.1 var(--px);margin:0 0 12px;letter-spacing:.03em;text-wrap:balance}
section.how p{color:var(--muted);margin:0 0 12px;max-width:56ch}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 14px}
.step b{font:700 12px var(--px);background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:3px;flex:none;margin-top:2px}
.step span{color:var(--muted);font-size:14px}
.ptable{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow-x:auto}
.ptable table{border-collapse:collapse;width:100%;min-width:300px}
.ptable th,.ptable td{padding:9px 14px;text-align:start;font-size:14px;border-bottom:1px solid var(--line)}
.ptable th{font:500 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ptable tr:last-child td{border-bottom:0}
.ptable td:last-child{font:700 15px var(--px);font-variant-numeric:tabular-nums;text-align:end}
.ptable th:last-child{text-align:end}
.dash{font:700 15px var(--px);color:var(--muted);letter-spacing:.06em}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{width:min(960px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;position:relative;box-shadow:0 40px 110px rgba(0,0,0,.6);animation:pop .34s cubic-bezier(.2,.9,.25,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}}
.sheet .x{z-index:6}
.pf{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr)}
.stage{position:relative;min-height:440px;display:flex;align-items:center;justify-content:center;padding:28px 16px 40px;overflow:hidden;perspective:900px;border-radius:12px 0 0 12px;
  background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--c,var(--accent)) 40%,transparent),transparent 64%),linear-gradient(180deg,var(--bg2),var(--bg))}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);bac
